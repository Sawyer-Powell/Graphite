# Compilation performance optimizations
[build]
# Use more parallel codegen units for faster compilation
codegen-units = 256
# Enable incremental compilation
incremental = true

# Use faster linker on supported platforms
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

[target.wasm32-unknown-unknown]
rustflags = [
	# Currently disabled because of https://github.com/GraphiteEditor/Graphite/issues/1262
	# The current simd implementation leads to undefined behavior
	#"-C",
	#"target-feature=+simd128",
	"-C",
	"target-feature=+bulk-memory",
	"-C",
	"link-arg=--max-memory=4294967296",
	"--cfg=web_sys_unstable_apis",
]
